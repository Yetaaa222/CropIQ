<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropIQ Admin | Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(229, 231, 235, 0.5); }
        .sidebar-item { @apply flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 transition-all duration-200 hover:bg-green-50 hover:text-green-700; }
        .sidebar-item.active { @apply bg-green-600 text-white shadow-lg shadow-green-200; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-gray-900 overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-100 flex flex-col hidden lg:flex">
            <div class="p-6">
                <div class="flex items-center gap-3 text-green-600">
                    <span class="text-3xl">🌱</span>
                    <span class="font-bold text-xl tracking-tight">CropIQ Admin</span>
                </div>
            </div>
            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="admin.html" class="sidebar-item">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Dashboard
                </a>
                <a href="users.html" class="sidebar-item active">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Users
                </a>
                <a href="articles.html" class="sidebar-item">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Articles
                </a>
                <a href="settings.html" class="sidebar-item">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-bold text-gray-800">User Management</h2>
                <div class="flex items-center gap-4">
                    <input type="text" id="user-search" placeholder="Search users..." class="px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-500/20 transition-all w-64">
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="glass-card rounded-2xl bg-white overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50/50 text-gray-400 font-medium border-b border-gray-100">
                            <tr>
                                <th class="px-6 py-4">User</th>
                                <th class="px-6 py-4">Province</th>
                                <th class="px-6 py-4">Experience</th>
                                <th class="px-6 py-4">Farms</th>
                                <th class="px-6 py-4">Joined</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- User Profile Slide-over -->
    <div id="user-panel-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-md z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeUserPanel()"></div>
    <div id="user-panel" class="fixed top-0 right-0 h-full w-full max-w-lg bg-[#f8fafc] shadow-[-20px_0_50px_-10px_rgba(0,0,0,0.1)] z-50 transform translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] flex flex-col">
        <div class="relative h-48 bg-gradient-to-br from-green-600 to-green-800 p-8 flex flex-col justify-end overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -mr-20 -mt-20 blur-3xl"></div>
            <div class="absolute top-6 left-6 right-6 flex justify-between items-start z-10">
                <button onclick="closeUserPanel()" class="p-2.5 bg-black/20 hover:bg-black/30 text-white rounded-2xl transition-all active:scale-90">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <div class="px-3 py-1 bg-white/20 border border-white/20 rounded-full text-[10px] font-bold text-white uppercase tracking-widest backdrop-blur-md">User Profile</div>
            </div>
            <div class="relative z-10 flex items-center gap-5">
                <div id="u-avatar" class="w-20 h-20 rounded-3xl bg-white shadow-xl flex items-center justify-center font-bold text-3xl text-green-700 border-4 border-white/30 transform transition-transform hover:rotate-3">?</div>
                <div class="text-white">
                    <h3 id="u-name" class="font-extrabold text-2xl tracking-tight leading-none">User Name</h3>
                    <p id="u-id" class="text-xs text-white/60 font-mono mt-2 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> ID: ...</p>
                </div>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-2 text-gray-400"><span class="text-lg">🗺️</span><span class="text-[10px] font-bold uppercase tracking-wider">Province</span></div>
                    <p id="u-province" class="font-bold text-gray-800 text-sm">Not set</p>
                </div>
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-2 text-gray-400"><span class="text-lg">📐</span><span class="text-[10px] font-bold uppercase tracking-wider">Farm Size</span></div>
                    <p id="u-farm-size" class="font-bold text-gray-800 text-sm">Not set</p>
                </div>
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-2 text-gray-400"><span class="text-lg">⏳</span><span class="text-[10px] font-bold uppercase tracking-wider">Experience</span></div>
                    <p id="u-experience" class="font-bold text-gray-800 text-sm">0 Years</p>
                </div>
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-2 text-gray-400"><span class="text-lg">🧪</span><span class="text-[10px] font-bold uppercase tracking-wider">Soil Type</span></div>
                    <p id="u-soil" class="font-bold text-gray-800 text-sm">Not set</p>
                </div>
            </div>
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h4 class="font-bold text-gray-800 flex items-center gap-2"><span class="w-8 h-8 rounded-xl bg-green-100 text-green-600 flex items-center justify-center text-sm">🌿</span>Interests</h4>
                    <span id="u-crops-count" class="text-[10px] font-bold bg-gray-100 text-gray-500 px-2 py-1 rounded-lg">0 Crops</span>
                </div>
                <div id="u-crops" class="flex flex-wrap gap-2"></div>
            </section>
            <section>
                <h4 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><span class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-sm">📍</span>Registered Farms</h4>
                <div id="u-farms-list" class="space-y-3"></div>
            </section>
            <section>
                <h4 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><span class="w-8 h-8 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center text-sm">✨</span>Recent Activity</h4>
                <div id="u-recs-list" class="bg-white rounded-3xl border border-gray-100 overflow-hidden"></div>
            </section>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://frcbiyxewkumgawpfsgo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zr2cDjHGalkdXoAdaXbTHw_S_fyxX0r';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allUsers = [];

        async function loadUsers() {
            const { data: users, error } = await supabaseClient.from('user_profiles').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);
            allUsers = users;
            renderUsers(users);
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = users.map(u => `
                <tr class="group hover:bg-green-50/30 transition-colors cursor-pointer" onclick="openUserPanel('${u.id}')">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-500 group-hover:bg-green-100 group-hover:text-green-600 transition-colors">${u.full_name.charAt(0)}</div>
                            <div>
                                <p class="font-bold text-gray-700 group-hover:text-green-700 transition-colors">${u.full_name}</p>
                                <p class="text-[10px] text-gray-400 font-mono">${u.id.substring(0,8)}...</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-gray-500">${u.province || '—'}</td>
                    <td class="px-6 py-4 text-gray-500">${u.experience_years || 0} yrs</td>
                    <td class="px-6 py-4 text-gray-500">${(u.selected_crops || []).length} crops</td>
                    <td class="px-6 py-4 text-gray-400 text-xs">${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex justify-end gap-2" onclick="event.stopPropagation()">
                            <button onclick="openUserPanel('${u.id}')" class="px-3 py-1.5 bg-green-50 text-green-600 rounded-lg text-xs font-bold hover:bg-green-600 hover:text-white transition-all">View Profile</button>
                            <button onclick="deleteUser('${u.id}', '${u.full_name}')" class="p-1.5 bg-red-50 text-red-600 rounded-lg hover:bg-red-600 hover:text-white transition-all">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function openUserPanel(userId) {
            const panel = document.getElementById('user-panel');
            const backdrop = document.getElementById('user-panel-backdrop');
            panel.classList.remove('translate-x-full');
            backdrop.classList.remove('hidden');
            setTimeout(() => backdrop.classList.remove('opacity-0'), 10);

            try {
                const [pRes, fRes, rRes] = await Promise.all([
                    supabaseClient.from('user_profiles').select('*').eq('id', userId).single(),
                    supabaseClient.from('farms').select('*').eq('user_id', userId),
                    supabaseClient.from('crop_recommendations').select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(5)
                ]);

                const profile = pRes.data;
                const farms = fRes.data || [];
                const recs = rRes.data || [];

                document.getElementById('u-name').innerText = profile.full_name;
                document.getElementById('u-id').innerText = `ID: ${profile.id}`;
                document.getElementById('u-avatar').innerText = profile.full_name.charAt(0);
                document.getElementById('u-province').innerText = profile.province || 'Not set';
                document.getElementById('u-farm-size').innerText = profile.farm_size || 'Not set';
                document.getElementById('u-experience').innerText = `${profile.experience_years || 0} Years`;
                document.getElementById('u-soil').innerText = profile.soil_type || 'Not set';

                const crops = profile.selected_crops || [];
                document.getElementById('u-crops-count').innerText = `${crops.length} Crops`;
                document.getElementById('u-crops').innerHTML = crops.map(c => `<span class="px-3 py-1 bg-green-50 text-green-700 rounded-full text-xs font-semibold border border-green-100">${c}</span>`).join('') || '<p class="text-gray-400 text-xs italic">No crops selected</p>';

                document.getElementById('u-farms-list').innerHTML = farms.map(f => `
                    <div class="p-4 bg-white border border-gray-100 rounded-3xl shadow-sm">
                        <div class="flex justify-between items-start mb-2"><p class="font-bold text-gray-800">${f.name}</p><span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-bold uppercase">${f.province}</span></div>
                        <p class="text-[10px] text-gray-400 font-mono">Coords: ${f.latitude.toFixed(4)}, ${f.longitude.toFixed(4)}</p>
                    </div>
                `).join('') || '<p class="text-gray-400 text-xs italic">No farms recorded</p>';

                document.getElementById('u-recs-list').innerHTML = recs.map(r => `
                    <div class="flex items-center justify-between p-4 border-b border-gray-50 last:border-0 hover:bg-gray-50/50">
                        <div><p class="font-bold text-sm text-gray-800">${r.crop_name}</p><p class="text-[10px] text-gray-400">${new Date(r.created_at).toLocaleDateString()}</p></div>
                        <div class="text-right"><p class="text-xs font-bold text-green-600">${r.suitability_score}%</p><p class="text-[10px] text-gray-400 uppercase tracking-widest">Match</p></div>
                    </div>
                `).join('') || '<p class="text-gray-400 text-xs italic p-4 text-center">No recent activity</p>';
            } catch (err) { alert('Failed to load user profile.'); }
        }

        function closeUserPanel() {
            document.getElementById('user-panel').classList.add('translate-x-full');
            document.getElementById('user-panel-backdrop').classList.add('opacity-0');
            setTimeout(() => document.getElementById('user-panel-backdrop').classList.add('hidden'), 300);
        }

        async function deleteUser(id, name) {
            if (!confirm(`Are you sure you want to delete ${name}'s profile?`)) return;
            try {
                const { error } = await supabaseClient.from('user_profiles').delete().eq('id', id);
                if (error) throw error;
                loadUsers();
            } catch (err) { alert('Error: ' + err.message); }
        }

        document.getElementById('user-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => u.full_name.toLowerCase().includes(term) || (u.province || '').toLowerCase().includes(term));
            renderUsers(filtered);
        });

        loadUsers();
    </script>
</body>
</html>
