        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.5);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }
        
        /* Redesigned Sidebar Styles */
        .sidebar-item {
            @apply flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 transition-all duration-300 ease-out relative;
        }
        .sidebar-item:hover {
            @apply bg-green-50/50 text-green-700 translate-x-1;
        }
        .sidebar-item.active {
            @apply bg-green-600 text-white shadow-xl shadow-green-200 translate-x-2;
        }
        .sidebar-item svg {
            @apply transition-transform duration-300;
        }
        .sidebar-item:hover svg {
            @apply scale-110;
        }
        
        /* Animations */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-nav { animation: slideInRight 0.5s ease-out forwards; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
