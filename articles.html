<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropIQ Admin | Articles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(229, 231, 235, 0.5); transition: all 0.2s; }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05); }
        .sidebar-item { @apply flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 transition-all duration-200 hover:bg-green-50 hover:text-green-700; }
        .sidebar-item.active { @apply bg-green-600 text-white shadow-lg shadow-green-200; }
    </style>
</head>
<body class="bg-[#f8fafc] text-gray-900 overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-100 flex flex-col hidden lg:flex">
            <div class="p-6">
                <div class="flex items-center gap-3 text-green-600">
                    <span class="text-3xl">🌱</span>
                    <span class="font-bold text-xl tracking-tight">CropIQ Admin</span>
                </div>
            </div>
            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="admin.html" class="sidebar-item">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Dashboard
                </a>
                <a href="users.html" class="sidebar-item">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    Users
                </a>
                <a href="articles.html" class="sidebar-item active">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Articles
                </a>
                <a href="settings.html" class="sidebar-item">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-8 z-10">
                <h2 class="text-xl font-bold text-gray-800">Educational Articles</h2>
                <button onclick="openArticleModal()" class="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-green-100 transition-transform active:scale-95">+ New Article</button>
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="articles-grid">
                    <!-- Cards injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Article Editor Modal -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 hidden transition-opacity duration-300"></div>
    <div id="article-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 bg-green-600 text-white flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-xl text-white">Create New Article</h3>
                <button onclick="closeArticleModal()" class="p-2 hover:bg-black/10 rounded-xl">✕</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <form id="article-form" class="space-y-4">
                    <input type="hidden" id="article-id">
                    <div>
                        <label class="text-xs text-gray-400 font-bold uppercase">Unique ID (Numeric)</label>
                        <input type="number" id="f-id" required class="w-full mt-1 px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-500/20">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 font-bold uppercase">Title</label>
                        <input type="text" id="f-title" required class="w-full mt-1 px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-500/20">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 font-bold uppercase">Description</label>
                        <textarea id="f-description" rows="3" class="w-full mt-1 px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-500/20"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-gray-400 font-bold uppercase">Duration (e.g. 15 min read)</label>
                            <input type="text" id="f-duration" class="w-full mt-1 px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-500/20">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 font-bold uppercase">Icon (Emoji)</label>
                            <input type="text" id="f-icon" class="w-full mt-1 px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-green-500/20">
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-gray-100 flex gap-3">
                <button onclick="closeArticleModal()" class="flex-1 py-3 bg-gray-50 text-gray-500 font-bold rounded-xl text-sm">Cancel</button>
                <button onclick="saveArticle()" class="flex-1 py-3 bg-green-600 text-white font-bold rounded-xl text-sm shadow-lg shadow-green-100">Save Article</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://frcbiyxewkumgawpfsgo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zr2cDjHGalkdXoAdaXbTHw_S_fyxX0r';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let modules = [];
        let progress = [];

        async function loadArticles() {
            const { data: mData } = await supabaseClient.from('educational_modules').select('*').order('id', { ascending: true });
            const { data: pData } = await supabaseClient.from('learning_progress').select('*');
            modules = mData || [];
            progress = pData || [];
            renderArticles();
        }

        function renderArticles() {
            const grid = document.getElementById('articles-grid');
            grid.innerHTML = modules.map(m => {
                const completions = progress.filter(p => p.module_id === m.id && p.completed).length;
                return `
                    <div class="glass-card rounded-2xl p-6 bg-white flex flex-col relative group">
                        <div class="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openArticleModal(${m.id})" class="p-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                            <button onclick="deleteArticle(${m.id})" class="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-600 hover:text-white transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                        <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center text-2xl mb-4 group-hover:bg-green-50 group-hover:scale-110 transition-all">${m.icon || '📄'}</div>
                        <h3 class="font-bold text-gray-800 mb-2">${m.title}</h3>
                        <p class="text-xs text-gray-400 font-bold mb-2 uppercase">${m.duration || 'Short read'}</p>
                        <p class="text-xs text-gray-500 flex-1 mb-6">${m.description || 'No description provided.'}</p>
                        <div class="pt-4 border-t border-gray-50 flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Total Reach</span>
                            <span class="text-sm font-bold text-green-600">${completions} completions</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openArticleModal(id = null) {
            const modal = document.getElementById('article-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const form = document.getElementById('article-form');
            const title = document.getElementById('modal-title');
            
            form.reset();
            document.getElementById('article-id').value = '';
            document.getElementById('f-id').disabled = false;

            if (id) {
                const article = modules.find(m => m.id === id);
                document.getElementById('article-id').value = article.id;
                document.getElementById('f-id').value = article.id;
                document.getElementById('f-id').disabled = true; // Don't allow changing ID on edit
                document.getElementById('f-title').value = article.title;
                document.getElementById('f-description').value = article.description;
                document.getElementById('f-duration').value = article.duration;
                document.getElementById('f-icon').value = article.icon;
                title.innerText = 'Edit Article';
            } else {
                title.innerText = 'Create New Article';
            }

            modal.classList.remove('hidden');
            backdrop.classList.remove('hidden');
        }

        function closeArticleModal() {
            document.getElementById('article-modal').classList.add('hidden');
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        async function saveArticle() {
            const id = document.getElementById('f-id').value;
            const title = document.getElementById('f-title').value;
            const description = document.getElementById('f-description').value;
            const duration = document.getElementById('f-duration').value;
            const icon = document.getElementById('f-icon').value;
            const isEdit = !!document.getElementById('article-id').value;

            if (!id || !title) return alert('ID and Title are required');

            const payload = { id: parseInt(id), title, description, duration, icon };

            try {
                let error;
                if (isEdit) {
                    ({ error } = await supabaseClient.from('educational_modules').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabaseClient.from('educational_modules').insert([payload]));
                }

                if (error) throw error;
                
                closeArticleModal();
                loadArticles();
            } catch (err) {
                console.error(err);
                alert('Error saving article: ' + err.message);
            }
        }

        async function deleteArticle(id) {
            if (!confirm('Are you sure you want to delete this article? This will also remove completion data for users.')) return;

            try {
                const { error } = await supabaseClient.from('educational_modules').delete().eq('id', id);
                if (error) throw error;
                loadArticles();
            } catch (err) {
                console.error(err);
                alert('Error deleting article: ' + err.message);
            }
        }

        loadArticles();
    </script>
</body>
</html>
