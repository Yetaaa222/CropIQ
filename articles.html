<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropIQ Admin | Articles</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        #sidebar {
            width: 280px;
            min-width: 280px;
            background: #ffffff;
            border-right: 1px solid #f1f5f9;
            overflow-y: auto;
        }

        .sidebar-brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4ade80, #16a34a);
            border-radius: 14px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px -4px rgba(22, 163, 74, 0.25);
        }

        .sidebar-section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 0 1rem;
            margin-bottom: 0.5rem;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 1rem;
            border-radius: 0.75rem;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .sidebar-link:hover {
            background-color: rgba(240, 253, 244, 0.9);
            color: #15803d;
            transform: translateX(4px);
        }

        .sidebar-link.active {
            background-color: #16a34a;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 8px 20px -4px rgba(22, 163, 74, 0.35);
            transform: translateX(8px);
        }

        /* ── Scrollable main content ── */
        #main-content {
            overflow-y: auto;
            flex: 1;
        }

        /* ── Article cards ── */
        .article-card {
            background: #fff;
            border: 1px solid #f1f5f9;
            border-radius: 1.25rem;
            padding: 1.5rem;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 30px -5px rgba(0, 0, 0, 0.06);
        }

        .article-card .card-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
            opacity: 0;
            transform: translateY(4px);
            transition: all 0.2s ease;
        }

        .article-card:hover .card-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .article-icon {
            width: 48px;
            height: 48px;
            border-radius: 1rem;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.25s;
        }

        .article-card:hover .article-icon {
            background-color: #f0fdf4;
            transform: scale(1.08);
        }

        /* ── Modal ── */
        .modal-green .modal-header {
            background: #16a34a;
            color: #fff;
            border: none;
        }

        .modal-green .modal-content {
            border-radius: 1.25rem;
            overflow: hidden;
            border: none;
        }

        .modal-green .btn-close {
            filter: brightness(0) invert(1);
        }

        .content-block {
            background: #fff;
            border: 1px solid #f1f5f9;
            border-radius: 1rem;
            padding: 1rem;
            position: relative;
        }

        .content-block .block-delete {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
        }

        .content-block:hover .block-delete {
            opacity: 1;
        }

        .content-block .block-delete:hover {
            background: #dc2626;
            color: #fff;
        }

        .form-control:focus,
        .form-control:focus {
            border-radius: 0.75rem;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
        }

        .form-control {
            border-radius: 0.75rem;
            font-size: 0.875rem;
            border-color: #e2e8f0;
        }

        .dashed-zone {
            min-height: 80px;
            background: rgba(248, 250, 252, 0.5);
            border: 2px dashed #e2e8f0;
            border-radius: 1.25rem;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <div class="d-flex" style="height: 100vh;">

        <!-- ── Sidebar ── -->
        <aside id="sidebar" class="d-none d-lg-flex flex-column">
            <!-- Brand -->
            <div class="p-4 pb-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="sidebar-brand-icon">🌱</div>
                    <div>
                        <div class="fw-bold fs-6 text-dark lh-1">CropIQ</div>
                        <div class="text-uppercase text-success opacity-75"
                            style="font-size:10px; letter-spacing:0.18em; font-weight:700;">Intelligence</div>
                    </div>
                </div>
            </div>

            <!-- Nav -->
            <div class="flex-grow-1 px-3 d-flex flex-column gap-4 overflow-auto pb-4" style="font-size:0.875rem;">
                <div>
                    <p class="sidebar-section-label">Core Insights</p>
                    <nav class="d-flex flex-column gap-1">
                        <a href="admin.html" class="sidebar-link">
                            <i class="bi bi-grid-1x2"></i> Dashboard
                        </a>
                    </nav>
                </div>
                <div>
                    <p class="sidebar-section-label">Operations</p>
                    <nav class="d-flex flex-column gap-1">
                        <a href="users.html" class="sidebar-link">
                            <i class="bi bi-people"></i> Farmers
                        </a>
                        <a href="articles.html" class="sidebar-link active">
                            <i class="bi bi-journal-richtext"></i> Knowledge
                        </a>
                        <a href="crops.html" class="sidebar-link">
                            <i class="bi bi-flower1"></i> Crops
                        </a>
                    </nav>
                </div>
                <div>
                    <p class="sidebar-section-label">Platform</p>
                    <nav class="d-flex flex-column gap-1">
                        <a href="settings.html" class="sidebar-link">
                            <i class="bi bi-gear"></i> Settings
                        </a>
                    </nav>
                </div>
            </div>
        </aside>

        <!-- ── Main ── -->
        <div class="d-flex flex-column flex-grow-1 min-w-0">

            <!-- Header -->
            <header class="bg-white border-bottom d-flex align-items-center justify-content-between px-4"
                style="height:64px; border-color:#f1f5f9 !important; z-index:10;">
                <h2 class="mb-0 fw-bold fs-6 text-dark">Educational Articles</h2>
                <button onclick="openArticleModal()" class="btn btn-success btn-sm fw-bold px-3"
                    style="border-radius:0.75rem;">
                    <i class="bi bi-plus-lg me-1"></i> New Article
                </button>
            </header>

            <!-- Scrollable body -->
            <div id="main-content" class="p-4">
                <div class="row g-4" id="articles-grid">
                    <!-- Cards injected by JS -->
                </div>
            </div>
        </div><!-- /main col -->
    </div><!-- /flex wrapper -->

    <!-- ── Article Editor Modal ── -->
    <div class="modal fade" id="articleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content modal-green">
                <div class="modal-header px-4 py-3">
                    <h5 class="modal-title fw-bold" id="modal-title">Create New Article</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <!-- Metadata Form -->
                    <form id="article-form">
                        <p class="mb-3 fw-bold text-success text-uppercase" style="font-size:10px; letter-spacing:0.18em;">Basic Information</p>
                        <input type="hidden" id="article-id">
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label mb-1" style="font-size:10px; font-weight:700; text-transform:uppercase; color:#94a3b8;">ID</label>
                                <input type="number" id="f-id" required class="form-control form-control-sm">
                            </div>
                            <div class="col-md-9">
                                <label class="form-label mb-1" style="font-size:10px; font-weight:700; text-transform:uppercase; color:#94a3b8;">Title</label>
                                <input type="text" id="f-title" required class="form-control form-control-sm">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label mb-1" style="font-size:10px; font-weight:700; text-transform:uppercase; color:#94a3b8;">Description</label>
                            <textarea id="f-description" rows="2" class="form-control form-control-sm"></textarea>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label mb-1" style="font-size:10px; font-weight:700; text-transform:uppercase; color:#94a3b8;">Duration</label>
                                <input type="text" id="f-duration" class="form-control form-control-sm">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label mb-1" style="font-size:10px; font-weight:700; text-transform:uppercase; color:#94a3b8;">Icon</label>
                                <input type="text" id="f-icon" class="form-control form-control-sm">
                            </div>
                        </div>
                    </form>

                    <hr class="my-3" style="border-color:#f1f5f9;">

                    <!-- Content Blocks -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <p class="mb-0 fw-bold text-success text-uppercase" style="font-size:10px; letter-spacing:0.18em;">Article Content</p>
                        <div class="d-flex gap-2">
                            <button onclick="addContentBlock('text')" class="btn btn-sm fw-bold" style="background:#eff6ff; color:#2563eb; font-size:10px; border-radius:0.5rem; border:1px solid #dbeafe;">+ Add Text</button>
                            <button onclick="addContentBlock('image')" class="btn btn-sm fw-bold" style="background:#faf5ff; color:#9333ea; font-size:10px; border-radius:0.5rem; border:1px solid #f3e8ff;">+ Add Image</button>
                        </div>
                    </div>
                    <div id="content-blocks" class="dashed-zone d-flex flex-column gap-3">
                        <!-- Blocks injected here -->
                    </div>
                </div>
                <div class="modal-footer px-4 py-3" style="background:#f8fafc; border-color:#f1f5f9;">
                    <button type="button" class="btn btn-outline-secondary btn-sm px-4" data-bs-dismiss="modal" style="border-radius:0.75rem;">Cancel</button>
                    <button onclick="saveArticle()" class="btn btn-success btn-sm fw-bold px-4" style="border-radius:0.75rem;">
                        <i class="bi bi-floppy me-1"></i> Save Everything
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://frcbiyxewkumgawpfsgo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Zr2cDjHGalkdXoAdaXbTHw_S_fyxX0r';

        let supabaseClient;
        try {
            if (typeof supabase === 'undefined') throw new Error('Supabase not loaded');
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) { alert('Connection Error: ' + e.message); }

        let modules = [];
        let progress = [];
        let currentBlocks = [];
        let articleModalInstance;

        document.addEventListener('DOMContentLoaded', () => {
            articleModalInstance = new bootstrap.Modal(document.getElementById('articleModal'));
        });

        async function loadArticles() {
            if (!supabaseClient) return;
            try {
                const { data: mData } = await supabaseClient.from('educational_modules').select('*').order('id', { ascending: true });
                const { data: pData } = await supabaseClient.from('learning_progress').select('*');
                modules = mData || [];
                progress = pData || [];
                renderArticles();
            } catch (err) { console.error(err); }
        }

        function renderArticles() {
            const grid = document.getElementById('articles-grid');
            if (modules.length === 0) {
                grid.innerHTML = `<div class="col-12"><div class="text-center p-5 bg-white border rounded-4" style="border-color:#f1f5f9 !important;"><p class="text-muted mb-0">No articles found.</p></div></div>`;
                return;
            }
            grid.innerHTML = modules.map(m => {
                const completions = progress.filter(p => p.module_id === m.id && p.completed).length;
                return `
                    <div class="col-md-6 col-lg-4">
                        <div class="article-card d-flex flex-column h-100">
                            <div class="card-actions d-flex gap-2">
                                <button onclick="openArticleModal(${m.id})" class="btn btn-sm border" style="background:#fff; color:#2563eb; border-radius:0.75rem; border-color:#dbeafe !important;">
                                    <i class="bi bi-pencil" style="font-size:0.75rem;"></i>
                                </button>
                                <button onclick="deleteArticle(${m.id})" class="btn btn-sm border" style="background:#fff; color:#dc2626; border-radius:0.75rem; border-color:#fecaca !important;">
                                    <i class="bi bi-trash" style="font-size:0.75rem;"></i>
                                </button>
                            </div>
                            <div class="article-icon mb-3">${m.icon || '📄'}</div>
                            <h6 class="fw-bold text-dark mb-1">${m.title}</h6>
                            <div class="mb-3">
                                <span class="badge" style="background:#f8fafc; color:#94a3b8; font-size:10px; font-weight:700; border:1px solid #f1f5f9; border-radius:20px;">${m.duration || 'Short read'}</span>
                            </div>
                            <p class="text-muted flex-grow-1" style="font-size:0.8rem; line-height:1.6;">${m.description || '...'}</p>
                            <div class="pt-3 mt-auto border-top d-flex align-items-center justify-content-between" style="border-color:#f8fafc !important;">
                                <span class="text-muted text-uppercase" style="font-size:10px; font-weight:700; letter-spacing:0.08em;">Activity</span>
                                <span class="fw-bold text-success" style="font-size:0.8rem;">${completions} users read</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openArticleModal(id = null) {
            document.getElementById('article-form').reset();
            document.getElementById('article-id').value = '';
            document.getElementById('f-id').disabled = false;
            document.getElementById('content-blocks').innerHTML = '';
            currentBlocks = [];

            if (id) {
                const article = modules.find(m => m.id === id);
                document.getElementById('article-id').value = article.id;
                document.getElementById('f-id').value = article.id;
                document.getElementById('f-id').disabled = true;
                document.getElementById('f-title').value = article.title;
                document.getElementById('f-description').value = article.description;
                document.getElementById('f-duration').value = article.duration;
                document.getElementById('f-icon').value = article.icon;
                document.getElementById('modal-title').innerText = 'Edit Content';

                const { data: paragraphs } = await supabaseClient
                    .from('educational_module_paragraphs')
                    .select('*')
                    .eq('module_id', id)
                    .order('order_index', { ascending: true });

                (paragraphs || []).forEach(p => addContentBlock(p.type, p.paragraph || p.image_url));
            } else {
                document.getElementById('modal-title').innerText = 'New Knowledge Module';
                const nextId = modules.length > 0 ? Math.max(...modules.map(m => m.id)) + 1 : 1;
                document.getElementById('f-id').value = nextId;
            }

            articleModalInstance.show();
        }

        function addContentBlock(type, value = '') {
            const container = document.getElementById('content-blocks');
            const blockId = Date.now() + Math.random();
            const div = document.createElement('div');
            div.id = `block-${blockId}`;
            div.className = 'content-block';

            const contentHtml = type === 'text'
                ? `<textarea class="form-control form-control-sm border-0 bg-transparent p-0" placeholder="Enter paragraph text..." oninput="updateBlock('${blockId}', this.value)" style="resize:none; font-size:0.85rem;">${value}</textarea>`
                : `<div class="d-flex align-items-center gap-2">
                    <span style="font-size:1.1rem;">🖼️</span>
                    <input type="text" value="${value}" placeholder="Paste Image URL..." class="form-control form-control-sm border-0 bg-transparent p-0" oninput="updateBlock('${blockId}', this.value)" style="font-size:0.85rem;">
                   </div>`;

            div.innerHTML = `
                <div class="block-delete" onclick="removeBlock('${blockId}')">✕</div>
                <p class="mb-2 text-muted text-uppercase" style="font-size:8px; font-weight:700; letter-spacing:0.15em;">${type}</p>
                ${contentHtml}
            `;

            container.appendChild(div);
            currentBlocks.push({ id: blockId, type, content: value });
        }

        function updateBlock(id, val) {
            const block = currentBlocks.find(b => b.id.toString() === id.toString());
            if (block) block.content = val;
        }

        function removeBlock(id) {
            document.getElementById(`block-${id}`).remove();
            currentBlocks = currentBlocks.filter(b => b.id.toString() !== id.toString());
        }

        async function saveArticle() {
            const idVal = document.getElementById('f-id').value;
            const title = document.getElementById('f-title').value;
            const isEdit = !!document.getElementById('article-id').value;

            if (!idVal || !title) return alert('ID and Title are required');
            const id = parseInt(idVal);

            const moduleData = {
                id: id,
                title,
                description: document.getElementById('f-description').value,
                duration: document.getElementById('f-duration').value,
                icon: document.getElementById('f-icon').value
            };

            try {
                let mError;
                if (isEdit) {
                    ({ error: mError } = await supabaseClient.from('educational_modules').update(moduleData).eq('id', id));
                } else {
                    if (modules.some(m => m.id === id)) {
                        throw new Error(`ID ${id} already exists. Please use the suggested ID or another unique number.`);
                    }
                    ({ error: mError } = await supabaseClient.from('educational_modules').insert([moduleData]));
                }

                if (mError) throw mError;

                if (isEdit) await supabaseClient.from('educational_module_paragraphs').delete().eq('module_id', id);

                const paragraphData = currentBlocks.map((b, index) => ({
                    module_id: parseInt(id),
                    order_index: index,
                    type: b.type,
                    paragraph: b.type === 'text' ? b.content : '',
                    image_url: b.type === 'image' ? b.content : ''
                }));

                if (paragraphData.length > 0) {
                    const { error: pError } = await supabaseClient.from('educational_module_paragraphs').insert(paragraphData);
                    if (pError) throw pError;
                }

                articleModalInstance.hide();
                loadArticles();
            } catch (err) { alert('Save Failed: ' + err.message); }
        }

        async function deleteArticle(id) {
            if (!confirm('Delete this article and all its content?')) return;
            try {
                await supabaseClient.from('educational_modules').delete().eq('id', id);
                loadArticles();
            } catch (err) { alert(err.message); }
        }

        loadArticles();
    </script>
</body>

</html>
